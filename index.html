<style>
  :root{
    --bg:#F2ECE2;
    --ink:#221D18;
    --accent:#C25017;
    --accent-dark:#9C3E0E;
    --highlight:#F0B87A;
    --green:#4D6742;
    --amber:#A87220;
    --red:#9E3C2C;
    --card:#FFFFFF;
    --border:#DDD0BB;
    --neutral-bg:#F0EAE0;
  }
  *{ font-family:'Assistant', sans-serif; }
  h1,h2,h3,.display{ font-family:'Rubik', sans-serif; }
  body{ background:var(--bg); color:var(--ink); }
  .tag{
    position:relative;
    border-radius:8px;
  }
  .tag::before{
    content:"";
    position:absolute;
    top:-6px; right:14px;
    width:10px; height:10px;
    background:var(--bg);
    border:2px solid var(--border);
    border-radius:50%;
  }
  .badge-available{ background:#E9EEE1; color:var(--green); border:1px solid #C4D3B8; }
  .badge-borrowed{ background:#F4E7CE; color:var(--amber); border:1px solid #DFC29A; }
  .badge-repair{ background:#F0DAD3; color:var(--red); border:1px solid #DDB4A7; }
  .badge-requested{ background:#E6E1D5; color:#524A3F; border:1px solid #C7BFAE; }
  .btn-primary{ background:var(--accent); color:white; }
  .btn-primary:hover{ background:var(--accent-dark); }
  .btn-outline{ border:1px solid var(--border); background:white; }
  .btn-outline:hover{ background:var(--neutral-bg); }
  .input{ border:1px solid var(--border); border-radius:8px; padding:8px 12px; width:100%; background:white; }
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
  .modal-overlay{ position:fixed; inset:0; background:rgba(34,29,24,0.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .modal-card{ background:white; border-radius:16px; padding:24px; max-width:520px; width:100%; max-height:85vh; overflow-y:auto; }
  .nav-tab{ padding:8px 14px; border-radius:9999px; cursor:pointer; font-weight:600; }
  .nav-tab.active{ background:var(--ink); color:white; }
  .nav-tab:not(.active):hover{ background:var(--neutral-bg); }
  .cat-pill{
    padding:8px 16px;
    border-radius:9999px;
    cursor:pointer;
    font-weight:600;
    font-size:14px;
    background:white;
    border:1.5px solid var(--border);
    color:var(--ink);
    transition:all 0.15s ease;
    user-select:none;
  }
  .cat-pill:hover{ background:var(--neutral-bg); border-color:var(--accent); }
  .cat-pill.active{ background:var(--accent); color:white; border-color:var(--accent); }
  .smart-search-box{
    background:linear-gradient(135deg, #FFF7EE 0%, #FCEFDD 100%);
    border:1.5px solid var(--accent);
    border-radius:14px;
    padding:14px 18px;
    box-shadow:0 2px 8px rgba(194,80,23,0.08);
  }
  .smart-search-box input{
    border:1px solid var(--border);
    background:white;
    border-radius:10px;
    padding:10px 14px;
    width:100%;
    font-size:15px;
  }
  .smart-search-box input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(194,80,23,0.15); }
</style>

// הסרת ניקוד, סימני פיסוק ורווחים, המרה לאותיות קטנות - לצורך השוואה
function normalizeText(text){
  if(!text) return '';
  return String(text)
    .toLowerCase()
    .replace(/[֑-ׇ]/g,'')     // ניקוד
    .replace(/["'`׳״.,\-()\/\\\s]+/g,'') // סימני פיסוק ורווחים
    .trim();
}

// מחשב ציון התאמה של פריט לשאילתה. 0 = לא מתאים.
function smartSearchScore(query, item){
  const qn = normalizeText(query);
  if(!qn) return 1; // אין חיפוש → הכל מתאים
  const nameNorm = normalizeText(item.name);
  const descNorm = normalizeText(item.description);
  const catNorm = normalizeText(item.category);
  let score = 0;
  if(nameNorm.includes(qn)) score += 10;
  else if(descNorm.includes(qn)) score += 5;
  else if(catNorm.includes(qn)) score += 3;
  // בדיקת כינויים - האם השאילתה תואמת אחד הכינויים במילון,
  // ואז האם שם הפריט מכיל את אחד הביטויים המזוהים
  for(const {terms, match} of TOOL_ALIASES){
    const queryHitsAlias = terms.some(t => qn.includes(normalizeText(t)));
    if(!queryHitsAlias) continue;
    for(const m of match){
      const mn = normalizeText(m);
      if(nameNorm.includes(mn)) score += 8;
      else if(descNorm.includes(mn)) score += 4;
    }
  }
  return score;
}

function esc(s){
  if(s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

  if(!d) return '—';
  const dt = new Date(d);

  const ms = new Date(b) - new Date(a);

    overdue: ['badge-repair','באיחור'],
    returned: ['badge-available','הוחזר'],
    rejected: ['badge-repair','נדחה'],
  };
  const [cls,label] = map[status] || ['badge-requested', status];
  return `<span class="tag ${cls} px-3 py-1 text-sm inline-block">${label}</span>`;

}

async function requestLoan(equipmentId, start, end, quantity){
  quantity = quantity && quantity > 0 ? quantity : 1;
  if(daysDiff(start,end) > 3 || daysDiff(start,end) < 1){
    toast('תקופת ההשאלה יכולה להיות עד 3 ימים בלבד', true); return;
  }
  if(start < todayStr()){
    toast('לא ניתן לבחור תאריך שעבר', true); return;
  }
  const eq = state.equipment.find(e=>e.id === equipmentId);
  const avail = eq ? (eq.available_quantity ?? eq.quantity ?? 0) : 0;
  if(avail <= 0){
    toast('אין יחידות זמינות מהפריט הזה כרגע', true); return;
  }
  if(quantity > avail){
    toast(`אפשר לבקש עד ${avail} יחידות מהפריט הזה`, true); return;
  }
  const { error } = await supabase.from('loans').insert({
    equipment_id: equipmentId,
    member_id: state.session.user.id,
    requested_start_date: start,
    requested_end_date: end,
    quantity,
    status: 'requested'
  });
  if(error){ toast('שגיאה בבקשת השאלה: ' + error.message, true); return; }
  toast('הבקשה נשלחה, ממתינה לאישור מנהל');
  closeModal();
  await refreshAndRender();
}

async function uploadEquipmentImage(file){
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  const { data, error } = await supabase.storage.from('equipment-images').upload(path, file, { cacheControl: '3600', upsert: false });
  if(error){ toast('שגיאה בהעלאת התמונה: ' + error.message, true); return null; }
  const { data: pub } = supabase.storage.from('equipment-images').getPublicUrl(data.path);
  return pub.publicUrl;
}

async function adminAddCategory(name){
  name = (name || '').trim();
  if(!name) return null;
  const existing = state.categories.find(c => c.name === name);
  if(existing) return existing;
  const { data, error } = await supabase.from('categories').insert({ name }).select().single();
  if(error){ toast('שגיאה בהוספת קטגוריה: ' + error.message, true); return null; }
  state.categories.push(data);
  return data;
}

function trailerPriceFor(loan, eq){
  const perDay = loan.location_type === 'outside' ? (eq?.price_outside ?? 100) : (eq?.price_local ?? 50);
  const days = Math.max(1, daysDiff(loan.requested_start_date, loan.requested_end_date));
  return perDay * days;
}

function trailerInstructionsMessageFor(loan, eq){
  const perDay = loan.location_type === 'outside' ? (eq?.price_outside ?? 100) : (eq?.price_local ?? 50);
  const days = Math.max(1, daysDiff(loan.requested_start_date, loan.requested_end_date));
  const total = perDay * days;
  const priceLine = days > 1 ? `${total} ₪ (${perDay} ₪ ליום × ${days} ימים)` : `${total} ₪`;
  return trailerInstructionsMessage(priceLine);
}
async function adminApproveLoan(loan, overrideEndDate){
  const updatePayload = { status:'approved', approved_by: state.session.user.id };
  if(overrideEndDate && overrideEndDate !== loan.requested_end_date){
    updatePayload.requested_end_date = overrideEndDate;
  }
  const { error } = await supabase.from('loans').update(updatePayload).eq('id', loan.id);
  if(error){ toast('שגיאה: ' + error.message, true); return; }
  const eq = state.equipment.find(e=>e.id === loan.equipment_id);
  if(eq){
    const qty = loan.quantity || 1;
    const newAvailable = Math.max(0, (eq.available_quantity ?? eq.quantity ?? 1) - qty);
    await supabase.from('equipment').update({ available_quantity: newAvailable }).eq('id', eq.id);
  }
  if(loan.member?.email){
    try{
      const isSpecial = eq?.is_special_resource;
      const price = trailerPriceFor(loan, eq);
      await supabase.functions.invoke('send-custom-email', {
        body: {
          email: loan.member.email,
          full_name: loan.member.full_name,
          subject: isSpecial ? `הבקשה שלך אושרה - הפריט המיוחד מחכה לך! ✅` : `הבקשה שלך אושרה - ${eq?.name || 'ציוד'} מחכה לך! ✅`,
          message: isSpecial
            ? trailerInstructionsMessageFor(loan, eq)
            : `חדשות טובות - הבקשה שלך להשאלת "${eq?.name || ''}" אושרה! 🎉\n\n${pickupInfoText()}\n\nנשמח לראותכם!`,
        }
      });
    }catch(e){ console.error('approval email failed', e); }
  }
  if(loan.member?.phone){
    try{
      await supabase.functions.invoke('send-overdue-sms', {
        body: {
          phone: loan.member.phone,
          message: `הבקשה שלך מגמ"ח כלי עבודה אושרה. ניתן להגיע בשעות הפתיחה. מומלץ לתאם מראש בוואטסאפ: ${state.siteSettings.contact_phone || '052-6070995'}`,
        }
      });
    }catch(smsErr){ console.error('approval SMS failed', smsErr); }
  }
  toast('הבקשה אושרה, ונשלחה הודעה למבקש');
  await refreshAndRender();
}

function waPhoneFormat(phone){
  let digits = (phone || '').replace(/[^0-9]/g, '');
  if(digits.startsWith('0')) digits = '972' + digits.slice(1);
  else if(!digits.startsWith('972')) digits = '972' + digits;
  return digits;
}

}
function waLink(phone, text){
  return `https://wa.me/${waPhoneFormat(phone)}?text=${encodeURIComponent(text)}`;
}
async function adminMarkReturned(loan){
  const now = new Date();
  const wasLate = loan.status === 'overdue' || now.toISOString().slice(0,10) > loan.requested_end_date;
  const { error: e1 } = await supabase.from('loans').update({ status:'returned', actual_return_date: now.toISOString() }).eq('id', loan.id);
  const eq = state.equipment.find(e=>e.id === loan.equipment_id);
  let e2 = null;
  if(eq){
    const qty = loan.quantity || 1;
    const newAvailable = Math.min(eq.quantity ?? 1, (eq.available_quantity ?? 0) + qty);
    const res = await supabase.from('equipment').update({ available_quantity: newAvailable }).eq('id', eq.id);
    e2 = res.error;
  }
  if(e1 || e2){ toast('שגיאה בעדכון ההחזרה', true); return; }
  if(wasLate){
    const member = state.profiles.find(p=>p.id === loan.member_id) || await fetchProfile(loan.member_id);
    await supabase.from('profiles').update({ late_returns_count: (member?.late_returns_count||0) + 1 }).eq('id', loan.member_id);
  }
  if(loan.member?.email){
    try{
      await supabase.functions.invoke('send-custom-email', {
        body: {
          email: loan.member.email,
          full_name: loan.member.full_name,
          subject: `תודה שהחזרת את ${eq?.name || 'הפריט'}! 💛`,
          message: `תודה שהחזרת את "${eq?.name || ''}"! 🙏\n\nנשמח לראותכם שוב בפעם הבאה שתצטרכו משהו.`,
        }
      });
    }catch(e){ console.error('return email failed', e); }
  }
  toast('סומן כהוחזר');
  await refreshAndRender();
}

async function adminInstantLoan(equipmentId, memberId, start, end){
  const eq = state.equipment.find(e=>e.id === equipmentId);
  if(!eq){ toast('פריט לא נמצא', true); return false; }
  if((eq.available_quantity ?? eq.quantity ?? 0) <= 0){ toast(`אין יחידות זמינות מ-${eq.name}`, true); return false; }
  const { error: e1 } = await supabase.from('loans').insert({
    equipment_id: equipmentId,
    member_id: memberId,
    requested_start_date: start,
    requested_end_date: end,
    status: 'active',
    actual_pickup_date: new Date().toISOString(),
    approved_by: state.session.user.id,
  });
  if(e1){ toast('שגיאה ביצירת ההשאלה: ' + e1.message, true); return false; }
  const newAvailable = Math.max(0, (eq.available_quantity ?? eq.quantity ?? 1) - 1);
  const { error: e2 } = await supabase.from('equipment').update({ available_quantity: newAvailable }).eq('id', eq.id);
  if(e2){ toast('שגיאה בעדכון המלאי: ' + e2.message, true); return false; }
  eq.available_quantity = newAvailable;
  return true;
}

  try{
    const { error } = await supabase.functions.invoke('delete-user', { body: { user_id: profile.id } });
    if(error){ toast('שגיאה במחיקת המשתמש: ' + error.message, true); return; }
    toast('המשתמש נמחק');
    closeModal();
    await refreshAndRender();
  }catch(e){ toast('שגיאה במחיקת המשתמש', true); }

async function adminCreateUser(payload){
  try{
    const { data, error } = await supabase.functions.invoke('admin-create-user', { body: payload });
    if(error){ toast('שגיאה ביצירת המשתמש: ' + error.message, true); return false; }
    const full_name = `${payload.first_name} ${payload.last_name}`.trim();
    try{
      await supabase.functions.invoke('send-welcome-email', { body: { email: payload.email, full_name } });
    }catch(e){ console.error('welcome email failed', e); }
    if(data?.user_id){
      await supabase.from('profiles').update({ welcome_email_sent: true }).eq('id', data.user_id);
    }
    await supabase.auth.resetPasswordForEmail(payload.email);
    toast('המשתמש נוצר. נשלחו לו מייל ברוך הבא ומייל להגדרת סיסמה');
    return true;
  }catch(e){ toast('שגיאה ביצירת המשתמש', true); return false; }
}

function exportToExcel(){
  const wb = XLSX.utils.book_new();

  const equipSheet = XLSX.utils.json_to_sheet(state.equipment.map(e=>({
    'שם': e.name, 'קטגוריה': e.category, 'סטטוס': e.status, 'כמות כוללת': e.quantity ?? 1, 'כמות זמינה': e.available_quantity ?? e.quantity ?? 1, 'ברקוד': e.barcode || '', 'נוצר בתאריך': fmtDate(e.created_at)
  })));
  XLSX.utils.book_append_sheet(wb, equipSheet, 'ציוד');

  const loansSheet = XLSX.utils.json_to_sheet(state.allLoans.map(l=>({
    'פריט': l.equipment?.name || '', 'שם המנוי': l.member?.full_name || '', 'טלפון': l.member?.phone || '',
    'סטטוס': l.status, 'תאריך התחלה מבוקש': l.requested_start_date, 'תאריך סיום מבוקש': l.requested_end_date,
    'תאריך איסוף בפועל': l.actual_pickup_date ? fmtDate(l.actual_pickup_date) : '',
    'תאריך החזרה בפועל': l.actual_return_date ? fmtDate(l.actual_return_date) : '',
    'נוצר בתאריך': fmtDate(l.created_at)
  })));
  XLSX.utils.book_append_sheet(wb, loansSheet, 'השאלות');

  const usersSheet = XLSX.utils.json_to_sheet(state.profiles.map(p=>({
    'שם מלא': p.full_name, 'אימייל': p.email, 'טלפון': p.phone || '', 'תפקיד': p.role === 'admin' ? 'מנהל' : 'מנוי',
    'מושעה': p.is_suspended ? 'כן' : 'לא', 'מספר איחורים': p.late_returns_count, 'נרשם בתאריך': fmtDate(p.created_at)
  })));
  XLSX.utils.book_append_sheet(wb, usersSheet, 'משתמשים');

  XLSX.writeFile(wb, `hatzeigeria_export_${todayStr()}.xlsx`);
}

function openBarcodeScanner(onResult){
  showModal(`
    <h3 class="text-xl font-bold mb-4">סריקת ברקוד</h3>
    <div id="qr-reader" style="width:100%"></div>
    <button id="qr-cancel" class="btn-outline w-full mt-4 py-2 rounded-lg">ביטול</button>
  `, () => {
    const qr = new Html5Qrcode("qr-reader");
    qr.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 220 },
      (decodedText) => {
        qr.stop().then(()=>{ closeModal(); onResult(decodedText); });
      },
      ()=>{}
    ).catch((err)=>{ toast('לא ניתן לגשת למצלמה', true); console.error(err); });

    document.getElementById('qr-cancel').addEventListener('click', ()=>{
      qr.stop().catch(()=>{}); closeModal();
    });
  });
}

function equipmentAvailabilityBadge(item){
  if(item.status === 'in_repair') return statusBadge('in_repair');
  const qty = item.quantity ?? 1;
  const avail = item.available_quantity ?? qty;
  if(avail > 0) return `<span class="tag badge-available px-3 py-1 text-sm inline-block">זמין (${avail} מתוך ${qty})</span>`;
  return `<span class="tag badge-borrowed px-3 py-1 text-sm inline-block">אזל המלאי (0 מתוך ${qty})</span>`;
}
function equipmentCard(item, isAdminView){
  return `
  <div class="bg-white rounded-2xl border p-4 flex flex-col gap-2" style="border-color:var(--border)">
    ${item.image_url
      ? `<img src="${item.image_url}" class="w-full h-36 object-contain rounded-xl border" style="border-color:var(--border);background:var(--neutral-bg)" />`
      : `<div class="w-full h-36 rounded-xl flex items-center justify-center text-gray-400 text-sm" style="background:var(--neutral-bg);border:1px solid var(--border)">אין תמונה</div>`}
    <div class="flex items-start justify-between">
      <h3 class="font-bold text-lg">${item.name}</h3>
      ${equipmentAvailabilityBadge(item)}
    </div>
    <p class="text-sm text-gray-500">${item.category || ''}</p>
    <p class="text-sm text-gray-700">${item.description || ''}</p>
    <div class="flex gap-2 mt-2 flex-wrap">
      ${!isAdminView && item.status !== 'in_repair' && (item.available_quantity ?? item.quantity ?? 0) > 0 ? `<button class="btn-primary px-3 py-1.5 rounded-lg text-sm" data-request="${item.id}">בקש להשאיל</button>` : ''}
      ${!isAdminView ? `<button class="btn-outline px-3 py-1.5 rounded-lg text-sm" data-report="${item.id}">דווח על תקלה</button>` : ''}
    </div>
  </div>`;
}
function equipmentMatchesFilters(item, f){
  f = f || state.equipmentFilters;
  if(f.search){
    if(smartSearchScore(f.search, item) === 0) return false;
  }
  if(f.category && item.category !== f.category) return false;
  if(f.status){
    const avail = item.available_quantity ?? item.quantity ?? 0;
    if(f.status === 'in_repair' && item.status !== 'in_repair') return false;
    if(f.status === 'available' && (item.status === 'in_repair' || avail <= 0)) return false;
    if(f.status === 'borrowed' && (item.status === 'in_repair' || avail > 0)) return false;
  }
  return true;
}
function attachEquipmentCardEvents(){
  document.querySelectorAll('[data-request]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.request;
      const eq = state.equipment.find(e=>e.id === id);
      const maxAvail = eq ? (eq.available_quantity ?? eq.quantity ?? 1) : 1;
      showModal(`
        <h3 class="text-xl font-bold mb-4">בקשת השאלה - ${esc(eq?.name || '')}</h3>
        <p class="text-sm text-gray-500 mb-3">תקופת ההשאלה המקסימלית היא 3 ימים.</p>
        <div class="space-y-3">
          ${maxAvail > 1 ? `
          <label class="text-sm font-semibold">כמות מבוקשת (זמינות: ${maxAvail})</label>
          <input id="req-quantity" type="number" min="1" max="${maxAvail}" step="1" value="1" class="input" />` : ''}
          <label class="text-sm font-semibold">מתאריך</label>
          <input id="req-start" type="date" class="input" min="${todayStr()}" value="${todayStr()}" />
          <label class="text-sm font-semibold">עד תאריך</label>
          <input id="req-end" type="date" class="input" min="${todayStr()}" />
          <button id="req-submit" class="btn-primary w-full py-2.5 rounded-lg font-bold mt-2">שלח בקשה</button>
        </div>`, ()=>{
        document.getElementById('req-submit').addEventListener('click', ()=>{
          const start = document.getElementById('req-start').value;
          const end = document.getElementById('req-end').value;
          if(!start || !end){ toast('נא למלא תאריכים', true); return; }
          let quantity = 1;
          if(maxAvail > 1){
            quantity = parseInt(document.getElementById('req-quantity').value, 10);
            if(!Number.isFinite(quantity) || quantity < 1) quantity = 1;
            if(quantity > maxAvail){ toast(`אפשר לבקש עד ${maxAvail} יחידות`, true); return; }
          }
          requestLoan(id, start, end, quantity);
        });
      });
    });
  });
  document.querySelectorAll('[data-report]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.report;
      showModal(`
        <h3 class="text-xl font-bold mb-4">דיווח על תקלה</h3>
        <textarea id="report-desc" class="input" rows="4" placeholder="מה קרה עם הפריט?"></textarea>
        <button id="report-submit" class="btn-primary w-full py-2.5 rounded-lg font-bold mt-3">שלח דיווח</button>`, ()=>{
        document.getElementById('report-submit').addEventListener('click', ()=>{
          const desc = document.getElementById('report-desc').value.trim();
          if(!desc){ toast('נא לתאר את התקלה', true); return; }
          reportIssue(id, desc);
        });
      });
    });
  });
}

function isLoanOut(l){ return l.status === 'active' || l.status === 'overdue' || l.status === 'approved'; }
function isLoanOverdue(l){ return isLoanOut(l) && l.requested_end_date < todayStr(); }
async function adminSendOverdueReminder(loan){
  if(!loan.member?.email){ toast('אין כתובת מייל למשתמש זה', true); return; }
  const eq = state.equipment.find(e=>e.id === loan.equipment_id) || loan.equipment;
  try{
    const { error } = await supabase.functions.invoke('send-custom-email', {
      body: {
        email: loan.member.email,
        full_name: loan.member.full_name,
        subject: `תזכורת - החזרת ${eq?.name || 'ציוד'} באיחור`,
        message: `שלום, ברצוננו להזכיר שההשאלה של "${eq?.name || ''}" עברה את תאריך ההחזרה (${fmtDate(loan.requested_end_date)}).\n\n${pickupInfoText()}\n\nנשמח שתחזירו את הפריט בהקדם האפשרי. תודה!`,
      }
    });
    if(error){ toast('שגיאה בשליחת התזכורת: ' + error.message, true); return; }
    if(loan.member?.phone){
      try{
        await supabase.functions.invoke('send-overdue-sms', {
          body: {
            phone: loan.member.phone,
            message: `גמ"ח כלי עבודה: תזכורת - יש להחזיר את ${eq?.name || 'הפריט'}. מועד ההחזרה חלף. פרטים: 052-6070995. תודה!`,
          }
        });
      }catch(smsErr){ console.error('SMS reminder failed (may not be approved yet)', smsErr); }
    }
    toast('תזכורת נשלחה');
  }catch(e){ toast('שגיאה בשליחת התזכורת', true); }
}

    if(l.actual_return_date) events.push({ date: l.actual_return_date, text: `${l.equipment?.name || ''} הוחזר על ידי ${esc(l.member?.full_name || '')}` });

  });
  return events.sort((a,b)=> new Date(b.date) - new Date(a.date)).slice(0, 8);

function renderDashboard(){
  const itemTypes = state.equipment.length;
  const repairItems = state.equipment.filter(e=>e.status==='in_repair');
  const repairUnits = repairItems.reduce((s,e)=>s+(e.quantity??1),0);
  const totalUnits = state.equipment.reduce((s,e)=> s + (e.quantity ?? 1), 0);
  const availableUnits = state.equipment.reduce((s,e)=> e.status==='in_repair' ? s : s + (e.available_quantity ?? e.quantity ?? 0), 0);
  const borrowedUnits = Math.max(0, totalUnits - availableUnits - repairUnits);

  document.querySelectorAll('[data-reject-dash]').forEach(b=>b.addEventListener('click', ()=>{

  new Chart(document.getElementById('chart-category'), {
    type:'pie',
    data:{ labels:categoryLabels, datasets:[{ data:Object.values(categories), backgroundColor:['#C15B26','#3F6657','#B8873A','#A8442F','#4C4C8C','#8C8C4C'] }] },
    options:{
      onClick:(evt, elements)=>{

      }
    }
  });

  const popularity = {};
  state.allLoans.forEach(l=>{
    if(!l.equipment_id) return;
    if(!popularity[l.equipment_id]) popularity[l.equipment_id] = { name: l.equipment?.name || 'לא ידוע', count: 0 };
    popularity[l.equipment_id].count++;
  });
  const sortedIds = Object.keys(popularity).sort((a,b)=>popularity[b].count - popularity[a].count).slice(0,5);
  new Chart(document.getElementById('chart-popular'), {
    type:'bar',
    data:{ labels: sortedIds.map(id=>popularity[id].name), datasets:[{ label:'מספר השאלות', data: sortedIds.map(id=>popularity[id].count), backgroundColor:'#C15B26' }] },
    options:{
      indexAxis:'y',
      onClick:(evt, elements)=>{
        if(elements.length){ openHoldersModal(sortedIds[elements[0].index]); }
      }
    }
  });
}

function openAssignEquipmentModal(profile){
  const availableItems = state.equipment.filter(e => e.status !== 'in_repair' && (e.available_quantity ?? e.quantity ?? 0) > 0);
  const selectedIds = new Set();
  showModal(`
    <h3 class="text-xl font-bold mb-4">השאלת ציוד ל-${profile.full_name}</h3>
    <div class="space-y-3">
      <input id="ae-search" placeholder="חיפוש פריט..." class="input" />
      <label class="text-sm font-semibold">בחר פריטים</label>
      <div id="ae-item-list" class="space-y-1" style="max-height:220px;overflow-y:auto"></div>
      <label class="text-sm font-semibold">מתאריך</label>
      <input id="ae-start" type="date" class="input" value="${todayStr()}" />
      <label class="text-sm font-semibold">עד תאריך</label>
      <input id="ae-end" type="date" class="input" value="${todayStr()}" />
      <button id="ae-submit" class="btn-primary w-full py-2.5 rounded-lg font-bold mt-2">השאל פריטים נבחרים</button>
    </div>`, ()=>{
    function renderItemList(){
      const q = (document.getElementById('ae-search').value || '').toLowerCase();
      const filtered = availableItems.filter(e => !q || `${esc(e.name)} ${esc(e.category || '')}`.toLowerCase().includes(q));
      document.getElementById('ae-item-list').innerHTML = filtered.map(e=>`
          <label class="flex items-center gap-2 border rounded-lg px-3 py-2" style="border-color:var(--border)">
            <input type="checkbox" value="${e.id}" class="assign-eq-checkbox" ${selectedIds.has(e.id) ? 'checked' : ''} />
            <span>${esc(e.name)} <span class="text-xs text-gray-500">(זמין: ${e.available_quantity ?? e.quantity})</span></span>
          </label>`).join('') || '<p class="text-gray-500 text-sm">לא נמצאו פריטים תואמים.</p>';
      document.querySelectorAll('.assign-eq-checkbox').forEach(c=>{
        c.addEventListener('change', ()=>{
          if(c.checked) selectedIds.add(c.value); else selectedIds.delete(c.value);
        });
      });
    }
    renderItemList();
    document.getElementById('ae-search').addEventListener('input', renderItemList);
    document.getElementById('ae-submit').addEventListener('click', async ()=>{
      const selected = Array.from(selectedIds);
      const start = document.getElementById('ae-start').value;
      const end = document.getElementById('ae-end').value;
      if(selected.length === 0){ toast('נא לבחור לפחות פריט אחד', true); return; }
      if(!start || !end || end < start){ toast('נא לבחור טווח תאריכים תקין', true); return; }
      let successCount = 0;
      for(const equipmentId of selected){
        const ok = await adminInstantLoan(equipmentId, profile.id, start, end);
        if(ok) successCount++;
      }
      toast(`נוצרו ${successCount} מתוך ${selected.length} השאלות`);
      closeModal();
      await refreshAndRender();
    });
  });
}
async function adminTransferLoan(loan, newMemberId){
  const eq = state.equipment.find(e=>e.id === loan.equipment_id);
  const newMember = state.profiles.find(p=>p.id === newMemberId);
  const now = new Date();
  const { error: e1 } = await supabase.from('loans').update({ status:'returned', actual_return_date: now.toISOString() }).eq('id', loan.id);
  if(e1){ toast('שגיאה בהעברה: ' + e1.message, true); return; }
  if(loan.member?.email){
    try{
      await supabase.functions.invoke('send-custom-email', {
        body: {
          email: loan.member.email,
          full_name: loan.member.full_name,
          subject: `${eq?.name || 'ציוד'} - עודכן כהוחזר`,
          message: `הפריט "${eq?.name || ''}" עודכן במערכת כהוחזר.\n\nתודה שהיית חלק מגמ"ח כלי עבודה!`,
        }
      });
    }catch(err){ console.error('transfer return email failed', err); }
  }
  const { error: e2 } = await supabase.from('loans').insert({
    equipment_id: loan.equipment_id,
    member_id: newMemberId,
    requested_start_date: todayStr(),
    requested_end_date: loan.requested_end_date,
    quantity: loan.quantity || 1,
    status: 'active',
    actual_pickup_date: now.toISOString(),
    approved_by: state.session.user.id,
  });
  if(e2){ toast('שגיאה ביצירת ההשאלה החדשה: ' + e2.message, true); return; }
  if(newMember?.email){
    try{
      await supabase.functions.invoke('send-custom-email', {
        body: {
          email: newMember.email,
          full_name: newMember.full_name,
          subject: `${eq?.name || 'ציוד'} נרשם על שמך בגמ"ח כלי עבודה`,
          message: `הפריט "${eq?.name || ''}" נרשם כעת על שמך בגמ"ח כלי עבודה (עד ${fmtDate(loan.requested_end_date)}).\n\n${pickupInfoText()}\n\nלכל שאלה ניתן ליצור קשר איתנו.`,
        }
      });
    }catch(err){ console.error('transfer assign email failed', err); }
  }
  toast('הפריט הועבר בהצלחה');
}
function openTransferModal(loan){

  const otherProfiles = [...state.profiles].filter(p=>p.id !== loan.member_id).sort((a,b)=>(a.full_name||'').localeCompare(b.full_name||'','he'));
  showModal(`

function openHoldersModal(equipmentId){

        saveBtn.textContent = 'שומר...';
        let image_url = document.getElementById('eq-image-url').value.trim() || null;
        const file = document.getElementById('eq-image-file').files[0];
        if(file){
          const uploadedUrl = await uploadEquipmentImage(file);
          if(!uploadedUrl){ saveBtn.disabled = false; saveBtn.textContent = originalLabel; return; }
          image_url = uploadedUrl;
        }
        let categoryValue = document.getElementById('eq-category').value;
        if(categoryValue === '__new__'){
          const newCatName = document.getElementById('eq-category-new').value.trim();
          if(!newCatName){ toast('נא להזין שם קטגוריה חדשה', true); saveBtn.disabled = false; saveBtn.textContent = originalLabel; return; }
          const cat = await adminAddCategory(newCatName);
          categoryValue = cat ? cat.name : newCatName;
        }
        let quantity = parseInt(document.getElementById('eq-quantity').value, 10);
        if(!Number.isFinite(quantity) || quantity < 1) quantity = 1;
        const payload = {
          name,
          category: categoryValue,
          description: document.getElementById('eq-desc').value.trim(),
          image_url,
          barcode: document.getElementById('eq-barcode').value.trim() || null,
          status: document.getElementById('eq-status').value,
          quantity,

          price_local: parseFloat(document.getElementById('eq-price-local').value) || 0,
          price_outside: parseFloat(document.getElementById('eq-price-outside').value) || 0,

          // שומר על מספר היחידות המושאלות בפועל בזמן שינוי הכמות הכוללת
          const oldQuantity = item.quantity ?? 1;
          const oldAvailable = item.available_quantity ?? oldQuantity;
          const delta = quantity - oldQuantity;
          payload.available_quantity = Math.max(0, Math.min(quantity, oldAvailable + delta));
        } else {
          payload.available_quantity = quantity;
        }
        if(item) adminUpdateEquipment(item.id, payload); else adminAddEquipment(payload);
      });
    });
  }
  document.getElementById('add-equip-btn').addEventListener('click', ()=>openForm(null));
  document.getElementById('manage-categories-btn').addEventListener('click', ()=>openCategoryManager());

const CALENDAR_MONTH_NAMES = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
function buildCalendarHtml(year, month, dayLabelsFn, idPrefix){
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === todayStr();
    cells += `
      <div class="border rounded-lg p-1" style="border-color:var(--border);min-height:56px;${isToday?'background:var(--neutral-bg)':''}">

async function adminCancelTrailerBooking(loan){
  if(!confirm('לבטל את ההזמנה הזו? המשתמש יקבל הודעה במייל.')) return;
  const eq = state.equipment.find(e=>e.id === loan.equipment_id);
  const { error } = await supabase.from('loans').update({ status: 'rejected' }).eq('id', loan.id);
  if(error){ toast('שגיאה: ' + error.message, true); return; }
  if(eq){
    const newAvailable = Math.min(eq.quantity ?? 1, (eq.available_quantity ?? 0) + (loan.quantity || 1));
    await supabase.from('equipment').update({ available_quantity: newAvailable }).eq('id', eq.id);
  }
  if(loan.member?.email){
    try{
      await supabase.functions.invoke('send-custom-email', {
        body: {
          email: loan.member.email,
          full_name: loan.member.full_name,
          subject: `ההזמנה שלך בוטלה`,
          message: `לצערנו, ההזמנה שלך בתאריכים ${fmtDate(loan.requested_start_date)} - ${fmtDate(loan.requested_end_date)} בוטלה.\n\nלכל שאלה ניתן ליצור קשר איתנו.`,
        }
      });
    }catch(e){ console.error('cancel email failed', e); }
  }
  toast('ההזמנה בוטלה');
  await refreshAndRender();
}

    if(loan) adminCancelTrailerBooking(loan);
  }));
  document.querySelectorAll('[data-toggle-paid]').forEach(cb=>cb.addEventListener('change', async (e)=>{
    const loanId = cb.dataset.togglePaid;
    const { error } = await supabase.from('loans').update({ payment_status: e.target.checked ? 'paid' : 'unpaid' }).eq('id', loanId);
    if(error){ toast('שגיאה: ' + error.message, true); return; }
    toast('הסטטוס עודכן');
    await refreshAndRender();
  }));
  document.querySelectorAll('[data-view-checklist]').forEach(b=>b.addEventListener('click', ()=>openViewChecklistsModal(b.dataset.viewChecklist)));
  document.querySelectorAll('[data-return-trailer]').forEach(b=>b.addEventListener('click', ()=>{
    const loan = trailerLoans.find(l=>l.id===b.dataset.returnTrailer);
    if(loan) adminMarkReturned(loan);
  }));
  document.querySelectorAll('[data-pickup-trailer]').forEach(b=>b.addEventListener('click', ()=>{
    const loan = trailerLoans.find(l=>l.id===b.dataset.pickupTrailer);
    if(loan) adminMarkPickedUp(loan);
  }));
}


// ============================================================
// הצעות ציוד
// ============================================================
async function submitEquipmentSuggestion(name, category, description){
  if(!name){ toast('נא למלא שם פריט', true); return; }
  const { error } = await supabase.from('equipment_suggestions').insert({
    name, category: category || null, description: description || null,
    suggested_by: state.session.user.id,
    status: 'pending',
  });
  if(error){ toast('שגיאה בשליחת ההצעה: ' + error.message, true); return; }
  toast('ההצעה נשלחה, תודה!');
  closeModal();
}
async function adminRejectSuggestion(id){
  if(!confirm('לדחות את ההצעה?')) return;
  const { error } = await supabase.from('equipment_suggestions').update({ status: 'rejected' }).eq('id', id);
  if(error){ toast('שגיאה: ' + error.message, true); return; }
  toast('ההצעה נדחתה');
  await refreshAndRender();
}
function openAddFromSuggestionModal(suggestion){
  const item = { name: suggestion.name, category: suggestion.category, description: suggestion.description };
  showModal(equipmentFormHtml(item), ()=>{
    document.getElementById('eq-category').addEventListener('change', (e)=>{
      document.getElementById('eq-category-new').style.display = e.target.value === '__new__' ? 'block' : 'none';
    });
    document.getElementById('eq-scan').addEventListener('click', ()=>{
      openBarcodeScanner((text)=>{ document.getElementById('eq-barcode').value = text; });
    });
    document.getElementById('eq-special').addEventListener('change', (e)=>{
      document.getElementById('eq-special-prices').style.display = e.target.checked ? 'grid' : 'none';
    });
    document.getElementById('eq-image-file').addEventListener('change', (e)=>{
      const f = e.target.files[0];
      if(!f) return;
      const url = URL.createObjectURL(f);
      document.getElementById('eq-image-preview').innerHTML = `<img src="${url}" class="w-28 h-28 object-contain rounded-lg border" style="border-color:var(--border);background:var(--neutral-bg)" />`;
    });
    document.getElementById('eq-save').addEventListener('click', async ()=>{
      const saveBtn = document.getElementById('eq-save');
      const name = document.getElementById('eq-name').value.trim();
      if(!name){ toast('נא למלא שם פריט', true); return; }
      saveBtn.disabled = true;
      const originalLabel = saveBtn.textContent;
      saveBtn.textContent = 'שומר...';
      let image_url = document.getElementById('eq-image-url').value.trim() || null;
      const file = document.getElementById('eq-image-file').files[0];
      if(file){
        const uploadedUrl = await uploadEquipmentImage(file);
        if(!uploadedUrl){ saveBtn.disabled = false; saveBtn.textContent = originalLabel; return; }
        image_url = uploadedUrl;
      }
      let categoryValue = document.getElementById('eq-category').value;
      if(categoryValue === '__new__'){
        const newCatName = document.getElementById('eq-category-new').value.trim();
        if(!newCatName){ toast('נא להזין שם קטגוריה חדשה', true); saveBtn.disabled = false; saveBtn.textContent = originalLabel; return; }
        const cat = await adminAddCategory(newCatName);
        categoryValue = cat ? cat.name : newCatName;
      }
      let quantity = parseInt(document.getElementById('eq-quantity').value, 10);
      if(!Number.isFinite(quantity) || quantity < 1) quantity = 1;
      const payload = {
        name,
        category: categoryValue,
        description: document.getElementById('eq-desc').value.trim(),
        image_url,
        barcode: document.getElementById('eq-barcode').value.trim() || null,
        status: document.getElementById('eq-status').value,
        quantity,
        available_quantity: quantity,
        is_special_resource: document.getElementById('eq-special').checked,
        price_local: parseFloat(document.getElementById('eq-price-local').value) || 0,
        price_outside: parseFloat(document.getElementById('eq-price-outside').value) || 0,
      };
      adminAddEquipment(payload, suggestion.id);
    });
  });
}
function renderAdminSuggestions(){
  const pending = state.equipmentSuggestions.filter(s=>s.status==='pending');
  const processed = state.equipmentSuggestions.filter(s=>s.status!=='pending');
  app.innerHTML = shellHeader() + `
    <div class="max-w-6xl mx-auto p-4">
      <h2 class="text-xl font-bold mb-4">הצעות ציוד</h2>
      <div class="bg-white rounded-2xl border p-4 mb-6" style="border-color:var(--border)">
        <h3 class="font-bold mb-3">ממתינות לטיפול ${pending.length ? `(${pending.length})` : ''}</h3>
        <div class="space-y-2">
          ${pending.map(s=>`
            <div class="flex flex-wrap items-center justify-between gap-2 border rounded-lg px-3 py-2" style="border-color:var(--border)">
              <div>
                <p class="font-bold">${esc(s.name)} ${s.category ? `<span class="text-sm text-gray-500">· ${esc(s.category)}</span>` : ''}</p>
                <p class="text-sm text-gray-500">${esc(s.description || '')}</p>
                <p class="text-xs text-gray-400">הוצע על ידי ${esc(s.suggester?.full_name || '')} · ${fmtDate(s.created_at)}</p>
              </div>
              <div class="flex gap-2">
                <button class="btn-primary px-3 py-1.5 rounded-lg text-sm" data-add-suggestion="${s.id}">הוסף לציוד</button>
                <button class="btn-outline px-3 py-1.5 rounded-lg text-sm" data-reject-suggestion="${s.id}">דחה</button>
              </div>
            </div>`).join('') || '<p class="text-gray-500 text-sm">אין הצעות ממתינות.</p>'}
        </div>
      </div>
      <div class="bg-white rounded-2xl border p-4" style="border-color:var(--border)">
        <h3 class="font-bold mb-3">היסטוריה</h3>
        <div class="space-y-2">
          ${processed.map(s=>`
            <div class="flex flex-wrap items-center justify-between gap-2 border rounded-lg px-3 py-2" style="border-color:var(--border)">
              <div>
                <p class="font-bold">${esc(s.name)}</p>
                <p class="text-xs text-gray-400">הוצע על ידי ${esc(s.suggester?.full_name || '')} · ${fmtDate(s.created_at)}</p>
              </div>
              ${s.status === 'added' ? '<span class="tag badge-available px-3 py-1 text-sm inline-block">נוסף לציוד</span>' : '<span class="tag badge-repair px-3 py-1 text-sm inline-block">נדחה</span>'}
            </div>`).join('') || '<p class="text-gray-500 text-sm">אין היסטוריה עדיין.</p>'}
        </div>
      </div>
    </div>`;
  attachShellEvents();
  document.querySelectorAll('[data-add-suggestion]').forEach(b=>b.addEventListener('click', ()=>{
    const s = state.equipmentSuggestions.find(x=>x.id===b.dataset.addSuggestion);
    if(s) openAddFromSuggestionModal(s);
  }));
  document.querySelectorAll('[data-reject-suggestion]').forEach(b=>b.addEventListener('click', ()=>adminRejectSuggestion(b.dataset.rejectSuggestion)));
}

function renderAdminSettings(){
  app.innerHTML = shellHeader() + `
    <div class="max-w-2xl mx-auto p-4">
      <h2 class="text-xl font-bold mb-4">הגדרות כלליות</h2>
      <p class="text-sm text-gray-500 mb-4">עדכון כאן משנה אוטומטית את כל המיילים והתזכורות שהמערכת שולחת - אין צורך לעדכן שום דבר אחר.</p>
      <div class="bg-white rounded-2xl border p-4 space-y-3" style="border-color:var(--border)">
        <div>
          <label class="text-sm text-gray-500 block mb-1">שעות פעילות לאיסוף והחזרה</label>
          <textarea id="settings-hours" class="input" rows="2">${esc(state.siteSettings.pickup_hours || '')}</textarea>
        </div>
        <div>
          <label class="text-sm text-gray-500 block mb-1">טלפון ליצירת קשר</label>
          <input id="settings-phone" class="input" value="${esc(state.siteSettings.contact_phone || '')}" />
        </div>
        <button id="settings-save" class="btn-primary w-full py-2.5 rounded-lg font-bold">שמור</button>
      </div>
    </div>`;
  attachShellEvents();
  document.getElementById('settings-save').addEventListener('click', async ()=>{
    const hours = document.getElementById('settings-hours').value.trim();
    const phone = document.getElementById('settings-phone').value.trim();
    const btn = document.getElementById('settings-save');
    btn.disabled = true; btn.textContent = 'שומר...';
    const rows = [
      { key: 'pickup_hours', value: hours },
      { key: 'contact_phone', value: phone },
    ];
    const { error } = await supabase.from('site_settings').upsert(rows, { onConflict: 'key' });
    btn.disabled = false; btn.textContent = 'שמור';
    if(error){ toast('שגיאה בשמירה: ' + error.message, true); return; }
    toast('ההגדרות נשמרו');
    await refreshAndRender();
  });
}
function renderCurrentView(){
  const map = {
    equipment: renderMemberEquipment, myloans: renderMemberLoans, profile: renderMemberProfile,
    dashboard: renderDashboard, 'admin-equipment': renderAdminEquipment, 'admin-loans': renderAdminLoans,
    'admin-users': renderAdminUsers, 'admin-reports': renderAdminReports, about: renderAbout,
    'admin-suggestions': renderAdminSuggestions, 'admin-settings': renderAdminSettings,
  };
  (map[state.view] || renderMemberEquipment)();
}

function updateFooterFromSettings(){
  const phoneEl = document.getElementById('footer-phone');
  const hoursEl = document.getElementById('footer-hours');
  if(phoneEl) phoneEl.textContent = state.siteSettings.contact_phone || '052-6070995';
  if(hoursEl) hoursEl.textContent = state.siteSettings.pickup_hours || 'בתיאום מראש';
}
async function refreshAndRender(){
  const isAdmin = state.profile?.role === 'admin';
  state.equipment = await fetchEquipment();
  state.categories = await fetchCategories();
  state.siteSettings = await fetchSiteSettings();
  updateFooterFromSettings();
  if(isAdmin){
    state.allLoans = await fetchAllLoans();
    state.profiles = await fetchProfiles();
    state.reports = await fetchReports();
    state.equipmentSuggestions = await fetchEquipmentSuggestions();
  } else {
    state.myLoans = await fetchMyLoans();
  }
  renderCurrentView();
}

async function maybeSendWelcomeEmail(profile){
  if(!profile || profile.welcome_email_sent) return;
  try{
    const { error } = await supabase.functions.invoke('send-welcome-email', {
      body: { email: profile.email, full_name: profile.full_name }
    });
    if(!error){
      await supabase.from('profiles').update({ welcome_email_sent: true }).eq('id', profile.id);
    } else {
      console.error('welcome email error', error);
    }
  }catch(e){ console.error('welcome email failed', e); }
}

// ============================================================
// אתחול
// ============================================================
function renderCompleteProfile(){
  app.innerHTML = `
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
      <img src="${LOGO_AUTH_SRC}" alt="גמ&quot;ח כלי עבודה" class="mb-3" style="height:224px;width:auto;" />
      <p class="text-gray-600 mb-4">רק עוד שלב אחד - נא להשלים את הפרטים הבאים כדי להמשיך.</p>
      <div class="space-y-3">
        <div class="flex gap-2">
          <input id="cp-first-name" placeholder="שם פרטי" class="input" value="${state.profile.first_name || ''}" />
          <input id="cp-last-name" placeholder="שם משפחה" class="input" value="${state.profile.last_name || ''}" />
        </div>
        <input id="cp-phone" placeholder="טלפון נייד" class="input" value="${state.profile.phone || ''}" />
        <input id="cp-id-number" placeholder="מספר תעודת זהות (אופציונלי)" class="input" value="${state.profile.id_number || ''}" />
        <button id="cp-save" class="btn-primary w-full py-2.5 rounded-lg font-bold">שמור והמשך</button>
        <button id="cp-logout" class="btn-outline w-full py-2.5 rounded-lg font-bold">התנתקות</button>
      </div>
    </div>
  </div>`;
  document.getElementById('cp-save').addEventListener('click', async ()=>{
    const first_name = document.getElementById('cp-first-name').value.trim();
    const last_name = document.getElementById('cp-last-name').value.trim();
    const phone = document.getElementById('cp-phone').value.trim();
    const id_number = document.getElementById('cp-id-number').value.trim();
    if(!first_name || !last_name || !phone){ toast('נא למלא שם פרטי, שם משפחה וטלפון', true); return; }
    const full_name = `${first_name} ${last_name}`.trim();
    const { error } = await supabase.from('profiles').update({ first_name, last_name, full_name, phone, id_number: id_number || null }).eq('id', state.profile.id);
    if(error){ toast('שגיאה: ' + error.message, true); return; }
    Object.assign(state.profile, { first_name, last_name, full_name, phone, id_number: id_number || null });
    await render();
  });
  document.getElementById('cp-logout').addEventListener('click', doSignOut);
}
function updateWhatsappVisibility(){
  const el = document.getElementById('whatsapp-bubble');
  if(!el) return;
  const isAdmin = state.profile && state.profile.role === 'admin';
  el.style.display = isAdmin ? 'none' : 'flex';
}
async function render(){
  const { data: { session } } = await supabase.auth.getSession();
  state.session = session;
  if(!session){ renderAuth(); updateWhatsappVisibility(); return; }
  if(!state.profile){
    state.profile = await fetchProfile(session.user.id);
  }
  if(!state.profile){ renderAuth(); return; }
  updateWhatsappVisibility();
  if(state.profile.is_suspended){
    app.innerHTML = `<div class="min-h-screen flex items-center justify-center p-4 text-center">
      <div>
        <h1 class="text-2xl font-bold mb-2" style="color:var(--red)">החשבון שלך מושעה</h1>
        <p class="text-gray-600 mb-4">פנה למנהל הפרויקט לפרטים נוספים.</p>
        <button id="logout-btn2" class="btn-outline px-4 py-2 rounded-lg">התנתקות</button>
      </div></div>`;
    document.getElementById('logout-btn2').addEventListener('click', doSignOut);
    return;
  }
  if(!state.profile.phone || !state.profile.first_name || !state.profile.last_name){
    const meta = state.session.user.user_metadata || {};
    const patch = {};
    if(!state.profile.phone && meta.phone) patch.phone = meta.phone;
    if(!state.profile.first_name && meta.first_name) patch.first_name = meta.first_name;
    if(!state.profile.last_name && meta.last_name) patch.last_name = meta.last_name;
    if(Object.keys(patch).length){
      await supabase.from('profiles').update(patch).eq('id', state.profile.id);
      Object.assign(state.profile, patch);
    }
  }
  if(!state.profile.phone || !state.profile.first_name || !state.profile.last_name){
    renderCompleteProfile();
    return;
  }
  state.view = state.profile.role === 'admin' ? 'dashboard' : 'equipment';
  maybeSendWelcomeEmail(state.profile);
  await refreshAndRender();
}

supabase.auth.onAuthStateChange((_event, session)=>{
  state.session = session;
  if(!session){ state.profile = null; }
  render();
});

render();
</script>
